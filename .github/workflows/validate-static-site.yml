name: Validate static guide

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check theme-boot.js
          node --check search-normalization.js
          node --check app.js
          node --check cooking.js
          node --check icon-pilot.js
          node --check ui-enhancements.js
          node --check search-enhancements.js
          node --check final-polish.js
          node --check theme-system.js
          node --check forest-palette.js
          node --check reading-system.js
          node --check theme-copy-polish.js
          node --check theme-integration.js
          node --check a11y-enhancements.js
          node --check game-guided-tour.js
          node --check scripts/serve-static.mjs
          node --check scripts/validate-data-contract.mjs
          node --check scripts/validate-name-normalization.mjs
          node --check scripts/validate-reading-system.mjs
          node --check scripts/validate-icon-assets.mjs
          node --check tests/e2e/site-regression.spec.cjs
          node --check tests/e2e/name-normalization.spec.cjs
          node --check tests/e2e/theme-system.spec.cjs
          node --check tests/e2e/forest-palette.spec.cjs
          node --check tests/e2e/soft-contrast.spec.cjs
          node --check tests/e2e/accessibility.spec.cjs
          node --check tests/e2e/reading-system.spec.cjs
          node --check tests/e2e/icon-pilot.spec.cjs
          node --check tests/e2e/game-guided-tour.spec.cjs
          node --check tests/e2e/issue-10-ranged-jobs.spec.cjs
          node --check tests/e2e/issue-57-magic-skill-trees.spec.cjs
          node --check tests/e2e/issue-9-thief-jobs.spec.cjs
          node --check tests/e2e/static-server-safety.spec.cjs
          node --check playwright.config.cjs

      - name: Validate JSON and content contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dataDir = path.join(process.cwd(), 'data');
          const jsonFiles = fs.readdirSync(dataDir).filter(name => name.endsWith('.json'));
          for (const name of jsonFiles) {
            JSON.parse(fs.readFileSync(path.join(dataDir, name), 'utf8'));
          }

          const cooking = JSON.parse(fs.readFileSync('data/cooking.json', 'utf8'));
          const life = JSON.parse(fs.readFileSync('data/life-skill-categories.json', 'utf8'));
          const professions = JSON.parse(fs.readFileSync('data/professions.json', 'utf8'));
          const skills = JSON.parse(fs.readFileSync('data/profession-skills.json', 'utf8'));
          const aliases = JSON.parse(fs.readFileSync('data/names.json', 'utf8'));
          const icons = JSON.parse(fs.readFileSync('data/icon-pilot.json', 'utf8'));

          if (cooking.length !== 26) throw new Error(`Expected 26 cooking records, got ${cooking.length}`);
          if (life.length !== 20) throw new Error(`Expected 20 life skills, got ${life.length}`);
          if (aliases.length < 10) throw new Error(`Expected at least 10 alias definitions, got ${aliases.length}`);

          const expectedLevels = {'Lv.1': 9, 'Lv.3': 1, 'Lv.5': 6, 'Lv.10': 6, 'Lv.15': 4};
          for (const [level, expected] of Object.entries(expectedLevels)) {
            const actual = cooking.filter(item => item.levelKey === level).length;
            if (actual !== expected) throw new Error(`${level}: expected ${expected}, got ${actual}`);
          }

          const documented = professions.filter(item => item.documented).map(item => item.id).sort();
          const expectedDocumented = [
            'archer',
            'crossbowman',
            'dual-blades',
            'fighter',
            'flame-mage',
            'frost-mage',
            'greatsword-warrior',
            'longbowman',
            'mage',
            'swordsman',
            'thief',
            'warrior'
          ];
          const expectedSkillCounts = {
            warrior: {active: 6, passive: 5},
            'greatsword-warrior': {active: 6, passive: 5},
            swordsman: {active: 6, passive: 5},
            archer: {active: 6, passive: 5},
            thief: {active: 6, passive: 5},
            fighter: {active: 6, passive: 5},
            'dual-blades': {active: 6, passive: 5},
            longbowman: {active: 6, passive: 5},
            crossbowman: {active: 6, passive: 5},
            mage: {active: 6, passive: 5},
            'flame-mage': {active: 6, passive: 5},
            'frost-mage': {active: 6, passive: 5}
          };
          if (JSON.stringify(documented) !== JSON.stringify(expectedDocumented)) {
            throw new Error(`Unexpected documented professions: ${documented.join(', ')}`);
          }

          for (const id of expectedDocumented) {
            const profession = skills[id];
            if (!profession) throw new Error(`Missing profession skill data: ${id}`);
            const expected = expectedSkillCounts[id];
            const expectedTotal = expected.active + expected.passive;
            const actualTotal = profession.active.length + profession.passive.length;
            if (
              profession.active.length !== expected.active ||
              profession.passive.length !== expected.passive ||
              actualTotal !== expectedTotal
            ) {
              throw new Error(`${id}: expected ${expected.active} active + ${expected.passive} passive, got ${profession.active.length} + ${profession.passive.length}`);
            }
            for (const skill of [...profession.active, ...profession.passive]) {
              if (!skill.name || !skill.description) throw new Error(`${id}: incomplete skill record`);
            }
          }

          const iconCount = Object.values(icons.categories || {}).flat().length;
          if (iconCount !== 134) throw new Error(`Expected 134 approved icon records, got ${iconCount}`);
          const uniqueIconShaCount = new Set(Object.values(icons.categories || {}).flat().map(icon => icon.sha256)).size;
          if (uniqueIconShaCount !== 131) throw new Error(`Expected 131 unique approved icon SHA256 values, got ${uniqueIconShaCount}`);
          const declaredShareCount = Object.values(icons.categories || {}).flat().filter(icon => Object.hasOwn(icon, 'sharedWith')).length;
          if (declaredShareCount !== 3) throw new Error(`Expected 3 declared icon shares, got ${declaredShareCount}`);

          const lifeIconCount = icons.categories?.lifeSkills?.length || 0;
          if (lifeIconCount !== 20) throw new Error(`Expected 20 approved life-skill icon records, got ${lifeIconCount}`);

          const professionSeriesIconCount = icons.categories?.professionSeries?.length || 0;
          if (professionSeriesIconCount !== 4) throw new Error(`Expected 4 approved profession-series icon records, got ${professionSeriesIconCount}`);

          console.log(`Validated ${jsonFiles.length} JSON files, ${cooking.length} cooking records, ${life.length} life skills, 12 professions, ${aliases.length} alias definitions, and ${iconCount} icon records (${uniqueIconShaCount} unique SHA256; ${declaredShareCount} declared shares; ${lifeIconCount}/20 life-skill categories covered; ${professionSeriesIconCount}/4 profession series).`);
          NODE

      - name: Validate public data and UI state contract
        run: node scripts/validate-data-contract.mjs

      - name: Validate name targets and representative searches
        run: node scripts/validate-name-normalization.mjs

      - name: Validate reading-size contract
        run: node scripts/validate-reading-system.mjs

      - name: Validate official icon asset contract
        run: node scripts/validate-icon-assets.mjs

      - name: Validate theme and reading matrix declarations
        run: |
          for appearance in system light dark; do
            grep -q "id: '$appearance'" theme-system.js
          done
          for palette in forest moonlight hearth amethyst contrast; do
            grep -q "id: '$palette'" theme-system.js
            grep -q "data-palette=\"$palette\"" theme-system.css
          done
          for reading in standard comfortable large; do
            grep -q "id: '$reading'" reading-system.js
          done
          grep -q 'data-appearance="system"' index.html
          grep -q 'data-palette="forest"' index.html
          grep -q 'data-reading-size="comfortable"' index.html

      - name: Validate forest palette material declarations
        run: |
          grep -q -- '--page: #d8ddd3' forest-palette.css
          grep -q -- '--page: #09130f' forest-palette.css
          grep -q -- '--surface-solid: #f5f1e6' forest-palette.css
          grep -q -- '--surface-solid: #1b2c24' forest-palette.css
          grep -q -- '--icon-well-bg' forest-palette.css
          grep -q 'forest-palette.css' index.html
          grep -q 'forest-palette.js' index.html

      - name: Parse HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          parser.close()
          print('index.html parsed successfully')
          PY

      - name: Check required assets, tests and routes
        run: |
          test -f styles.css
          test -f cooking.css
          test -f icon-pilot.css
          test -f ui-enhancements.css
          test -f search-enhancements.css
          test -f final-polish.css
          test -f theme-system.css
          test -f soft-contrast.css
          test -f forest-palette.css
          test -f theme-integration.css
          test -f a11y.css
          test -f game-guided-tour.css
          test -f reading-system.css
          test -f theme-boot.js
          test -f search-normalization.js
          test -f search-enhancements.js
          test -f icon-pilot.js
          test -f theme-system.js
          test -f forest-palette.js
          test -f reading-system.js
          test -f theme-copy-polish.js
          test -f theme-integration.js
          test -f a11y-enhancements.js
          test -f game-guided-tour.js
          test -f ICON_ASSET_CONTRACT.md
          test -f DATA_UI_STATE_CONTRACT.md
          test -f NAME_NORMALIZATION_CONTRACT.md
          test -f THEME_SYSTEM_CONTRACT.md
          test -f ACCESSIBILITY_BASELINE.md
          test -f READING_SYSTEM_CONTRACT.md
          test -f FOREST_PALETTE_CONTRACT.md
          test -f data/icon-pilot.json
          test -f scripts/serve-static.mjs
          test -f scripts/validate-icon-assets.mjs
          test -f docs/icon-pilot-validation.md
          test -f docs/data-contract-examples.json
          test -f MANUAL_TEST_CHECKLIST.md
          test -f package.json
          test -f playwright.config.cjs
          test -f tests/e2e/site-regression.spec.cjs
          test -f tests/e2e/name-normalization.spec.cjs
          test -f tests/e2e/theme-system.spec.cjs
          test -f tests/e2e/forest-palette.spec.cjs
          test -f tests/e2e/soft-contrast.spec.cjs
          test -f tests/e2e/accessibility.spec.cjs
          test -f tests/e2e/reading-system.spec.cjs
          test -f tests/e2e/icon-pilot.spec.cjs
          test -f tests/e2e/game-guided-tour.spec.cjs
          test -f tests/e2e/issue-9-thief-jobs.spec.cjs
          test -f tests/e2e/issue-10-ranged-jobs.spec.cjs
          test -f tests/e2e/static-server-safety.spec.cjs
          test -f docs/issue-46-game-guided-tour.md
          grep -q '#/profession/greatsword-warrior' index.html
          grep -q '#/profession/archer' index.html
          grep -q 'theme-boot.js' index.html
          grep -q 'search-normalization.js' index.html
          grep -q 'search-enhancements.js' index.html
          grep -q 'icon-pilot.js' index.html
          grep -q 'theme-system.js' index.html
          grep -q 'forest-palette.js' index.html
          grep -q 'reading-system.js' index.html
          grep -q 'theme-integration.js' index.html
          grep -q 'a11y-enhancements.js' index.html
          grep -q 'theme-system.css' index.html
          grep -q 'forest-palette.css' index.html
          grep -q 'icon-pilot.css' index.html
          grep -q 'reading-system.css' index.html
          grep -q 'a11y.css' index.html
          grep -q 'game-guided-tour.css' index.html
          grep -q 'final-polish.js' index.html
          grep -q 'game-guided-tour.js' index.html

  browser-regression:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright test runner
        run: npm install --ignore-scripts

      - name: Install Chromium for regression tests
        run: npx playwright install --with-deps chromium

      - name: Run route, responsive, accessibility and reading regression
        run: npm run test:e2e

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
