name: Apply Issue 23 hotfix

on:
  push:
    branches:
      - fix/issue-23-swordsman-steel-wedge
    paths:
      - scripts/hotfix-issue-23.mjs
      - .github/workflows/hotfix-issue-23.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-23-swordsman-steel-wedge
          fetch-depth: 0

      - name: Apply correction
        run: node scripts/hotfix-issue-23.mjs

      - name: Validate corrected files
        run: |
          node scripts/validate-name-normalization.mjs
          node scripts/validate-data-contract.mjs
          node -e "const fs=require('fs'); for (const f of fs.readdirSync('data').filter(x=>x.endsWith('.json'))) JSON.parse(fs.readFileSync('data/'+f,'utf8'));"
          ! grep -R --line-number --fixed-strings '鋼梭' data/profession-skills.json

      - name: Commit corrected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: 更正劍術士技能名稱為鋼楔'
          git push origin HEAD:fix/issue-23-swordsman-steel-wedge
